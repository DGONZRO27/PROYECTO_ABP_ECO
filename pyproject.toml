[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecovision"
version = "0.1.0"
description = "Clasificador educativo de residuos con TensorFlow, Keras y Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit==1.41.1",
    "tensorflow==2.15.1",
    "numpy<2.0",
    "Pillow>=10.2,<12",
]

[tool.setuptools.packages.find]
where = ["src"]
